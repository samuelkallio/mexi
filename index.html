<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f2f4f8; color: #1a1a2e; min-height: 100vh; font-size: 17px; }
  .screen { padding: 16px; padding-bottom: 110px; max-width: 600px; margin: 0 auto; }

  button:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-primary { background: #4a5df9; color: white; width: 100%; font-size: 1.1em; padding: 18px; }

  .topbar-round { font-size: 0.85em; color: #888; margin-top: 2px; }
  .topbar-actions { display: flex; gap: 6px; }
